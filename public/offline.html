<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — BPMSquare</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f6f9; color: #1c2733;
      }
      @media (prefers-color-scheme: dark) { body { background: #101114; color: #f2f3f5; } }
      .card { max-width: 360px; text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #F47C20; margin: 0 auto 18px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #5f6b7a; margin: 0 0 18px; }
      @media (prefers-color-scheme: dark) { p { color: #9aa1ac; } }
      button {
        font: inherit; font-weight: 600; font-size: 14px; padding: 10px 20px;
        border: none; border-radius: 9px; background: #378add; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Open it once while
        you're connected, and it'll be available offline afterwards. If you
        just need to punch in or out, open <strong>My Workforce</strong> — it
        works offline once loaded and syncs when you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
